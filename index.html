<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>単位のつながり帳</title>
<meta name="description" content="高校理科の単位が何からできていて、何をつくれるかをたどれる単位マップ">
<meta property="og:title" content="単位のつながり帳">
<meta property="og:description" content="高校理科の単位が何からできていて、何をつくれるかをたどれる単位マップ">
<meta property="og:image" content="https://unit.meetupsensei.com/ogp.jpg">
<meta property="og:url" content="https://unit.meetupsensei.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F5; --paper-2:#FFFFFF; --grid:#E3E8E1; --line:#CDD4CB;
  --ink:#1E2A32; --ink-2:#4E5B65; --ink-3:#8A949B;
  --phys:#2C5FC4; --chem:#B98614; --bio:#2F8A57; --geo:#8447A6; --base:#1E2A32;
  --phys-bg:#E8EFFB; --chem-bg:#F8F0DA; --bio-bg:#E3F2E8; --geo-bg:#EFE5F5; --base-bg:#E6E9EA;
  --accent:#2C5FC4; --accent-ink:#FFFFFF; --ok:#2F8A57; --ng:#C43C3C;
  --shadow:0 1px 0 rgba(30,42,50,.06), 0 6px 18px -8px rgba(30,42,50,.18);
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --serif:"STIX Two Text","Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15191D; --paper-2:#1E242A; --grid:#242B31; --line:#333C44;
    --ink:#E6EAED; --ink-2:#AEB7BE; --ink-3:#727C84;
    --phys:#7DA3F2; --chem:#E0B44A; --bio:#6CC48F; --geo:#C08BE0; --base:#E6EAED;
    --phys-bg:#22314D; --chem-bg:#3E3520; --bio-bg:#1F3B2C; --geo-bg:#36264A; --base-bg:#2A3239;
    --accent:#7DA3F2; --accent-ink:#0F1418; --ok:#6CC48F; --ng:#F08080;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#15191D; --paper-2:#1E242A; --grid:#242B31; --line:#333C44;
  --ink:#E6EAED; --ink-2:#AEB7BE; --ink-3:#727C84;
  --phys:#7DA3F2; --chem:#E0B44A; --bio:#6CC48F; --geo:#C08BE0; --base:#E6EAED;
  --phys-bg:#22314D; --chem-bg:#3E3520; --bio-bg:#1F3B2C; --geo-bg:#36264A; --base-bg:#2A3239;
  --accent:#7DA3F2; --accent-ink:#0F1418; --ok:#6CC48F; --ng:#F08080;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; line-height:1.6; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.u{font-family:var(--serif);font-weight:400;letter-spacing:.01em}
sup{font-size:.68em;line-height:0;vertical-align:.55em}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--paper-2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;
}
header h1{font-size:17px;font-weight:700;margin:0 16px 0 0;letter-spacing:.02em;white-space:nowrap}
header h1 small{font-weight:400;color:var(--ink-3);margin-left:8px;font-size:12px}
nav.tabs{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
nav.tabs button{border:0;background:transparent;border-radius:999px;padding:5px 14px;color:var(--ink-2);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper-2)}
.spacer{flex:1}
.theme{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:34px;height:30px;color:var(--ink-2)}

main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
.view{display:none}.view.on{display:block}

/* ---------- index view ---------- */
.index{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:22px;align-items:start}
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
.search input{border:0;background:transparent;flex:1;font-size:15px;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{color:var(--paper-2);border-color:transparent;background:var(--c,var(--ink))}
.chip.subj[data-s="物理"]{--c:var(--phys)} .chip.subj[data-s="化学"]{--c:var(--chem)} .chip.subj[data-s="生物"]{--c:var(--bio)} .chip.subj[data-s="地学"]{--c:var(--geo)}
.count{font-size:12px;color:var(--ink-3)}

.group{margin:14px 0 6px}
.group h3{font-size:12px;font-weight:500;color:var(--ink-3);margin:0 0 6px;letter-spacing:.04em;border-bottom:1px dashed var(--line);padding-bottom:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tile{
  position:relative;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r);
  padding:8px 8px 7px;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;
  border-left:3px solid var(--c,var(--base));
}
.tile[data-s="物理"]{--c:var(--phys)} .tile[data-s="化学"]{--c:var(--chem)} .tile[data-s="生物"]{--c:var(--bio)} .tile[data-s="地学"]{--c:var(--geo)} .tile[data-s="基本"]{--c:var(--base)}
.tile .sym{font-size:21px;line-height:1.1}
.tile .qty{font-size:11px;color:var(--ink-2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sel{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.tile.sel .qty{color:var(--paper-2);opacity:.75}
.tile.base .sym{font-weight:600}
.tile .scale{position:absolute;top:5px;right:6px;font-size:9px;color:var(--ink-3)}
.empty{color:var(--ink-3);padding:20px 4px;font-size:14px}

/* ---------- detail ---------- */
.detail{position:sticky;top:64px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px 24px 20px;min-height:420px}
.detail .close{display:none}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.detail .hint{color:var(--ink-3);font-size:14px;padding:60px 20px;text-align:center;line-height:1.9}
.detail .hint .u{font-size:34px;display:block;margin-bottom:10px;color:var(--ink-2)}
.subjline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg,var(--base-bg));color:var(--c,var(--ink-2))}
.tag[data-s="物理"]{--bg:var(--phys-bg);--c:var(--phys)} .tag[data-s="化学"]{--bg:var(--chem-bg);--c:var(--chem)} .tag[data-s="生物"]{--bg:var(--bio-bg);--c:var(--bio)} .tag[data-s="地学"]{--bg:var(--geo-bg);--c:var(--geo)}

.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:8px 0 18px;min-height:150px}
.flow .side{display:flex;flex-direction:column;gap:6px}
.flow .side h4{font-size:12px;font-weight:500;color:var(--ink-3);margin:0 0 2px}
.flow .side.left{align-items:flex-end;text-align:right}
.flow .side.left h4{text-align:right}
.center{text-align:center;padding:0 14px}
.center .big{font-size:62px;line-height:1;display:block}
.center .name{font-size:15px;font-weight:700;margin-top:6px}
.center .qty{font-size:13px;color:var(--ink-2)}
.link{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:4px 10px;font-size:14px;line-height:1.4;text-align:left}
.link .u{font-size:16px}
.link small{color:var(--ink-3);font-size:11px;margin-left:6px}
.link:hover{border-color:var(--accent)}
.flow .arrow{color:var(--ink-3);font-size:12px;text-align:center}
.side .none{font-size:12px;color:var(--ink-3);max-width:180px}
.side.right .none{text-align:left}

.sec{border-top:1px dashed var(--line);padding:12px 0 4px}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.03em}
.eq{font-size:20px;margin:2px 0}
.eq .u{font-size:22px}
.eq .tok{background:transparent;border:0;padding:0 2px;border-bottom:1.5px dotted var(--line);font-family:var(--serif);font-size:22px}
.eq .tok:hover{border-bottom-color:var(--accent);color:var(--accent)}
.dimrow{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.dimrow .u{font-size:20px}
.dimrow .br{color:var(--ink-2);font-size:16px}
.note{font-size:14px;color:var(--ink-2);margin:0}
.formulas{display:flex;gap:8px;flex-wrap:wrap}
.formula{font-family:var(--serif);font-size:17px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:2px 10px}
.formula i{font-style:italic}
.conv{font-size:14px;color:var(--ink-2)}
.conv .u{font-size:16px}

/* ---------- builder ---------- */
.builder{display:grid;grid-template-columns:1fr minmax(320px,440px);gap:22px;align-items:start}
.board{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px 22px;position:sticky;top:64px}
.board h2{font-size:15px;margin:0 0 4px;font-weight:700}
.board p.lead{margin:0 0 14px;font-size:13px;color:var(--ink-2)}
.frac{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;margin-bottom:12px}
.frac label{font-size:12px;color:var(--ink-3);white-space:nowrap}
.slot{min-height:46px;border:1.5px dashed var(--line);border-radius:var(--r);padding:5px 6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--paper)}
.slot.hot{border-color:var(--accent);border-style:solid}
.slot .ph{font-size:12px;color:var(--ink-3);padding:0 4px}
.piece{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r);padding:2px 4px 2px 8px}
.piece .u{font-size:18px}
.piece button{border:0;background:transparent;color:var(--ink-3);padding:0 4px;font-size:12px;line-height:1}
.piece button:hover{color:var(--ink)}
.bar{height:1.5px;background:var(--ink);margin:0;grid-column:2}
.mode{display:flex;gap:6px;margin-bottom:12px;align-items:center;font-size:13px;color:var(--ink-2)}
.mode button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.result{border-top:1px dashed var(--line);padding-top:12px}
.result .rexp{font-size:24px;min-height:34px}
.result .rexp .u{font-size:26px}
.result .rq{color:var(--ink-3);font-size:13px}
.matches{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.match{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;background:var(--paper);text-align:left}
.match .u{font-size:22px;min-width:52px}
.match .n{font-size:14px}
.match .q{font-size:12px;color:var(--ink-2)}
.match:hover{border-color:var(--accent)}
.goal{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.goal h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--ink-3)}
.goals{display:flex;flex-wrap:wrap;gap:6px}
.goals button{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:3px 9px;font-size:13px}
.goals button .u{font-size:16px}
.goals button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.goals button.done{border-color:var(--ok);color:var(--ok)}
.verdict{margin-top:10px;font-size:14px;padding:8px 12px;border-radius:var(--r);background:var(--paper)}
.verdict.ok{background:var(--bio-bg);color:var(--ok)}
.verdict.ng{color:var(--ink-2)}
.palette .tiles{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.palette .tile{min-height:54px;padding:6px 7px}
.palette .tile .sym{font-size:19px}
.palette .tile .qty{font-size:10px}

/* ---------- quiz ---------- */
.quiz{max-width:640px;margin:0 auto;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px 26px}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:13px;margin-bottom:8px}
.qtype{font-size:12px;color:var(--ink-3)}
.qtext{font-size:20px;margin:6px 0 16px;line-height:1.5}
.qtext .u{font-size:26px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px 14px;text-align:left;font-size:17px;display:flex;align-items:center;gap:12px}
.opt .u{font-size:22px}
.opt .k{font-size:12px;color:var(--ink-3);min-width:14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--bio-bg)}
.opt.wrong{border-color:var(--ng);opacity:.85}
.expl{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--paper);font-size:14px;color:var(--ink-2);display:none}
.expl.on{display:block}
.expl b{color:var(--ink)}
.expl .u{font-size:16px}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);border-radius:999px;padding:7px 18px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.qsetup{text-align:center;padding:10px 0}
.qsetup p{color:var(--ink-2);font-size:14px}
.qsetup .chips{justify-content:center;margin:12px 0 18px}
.score{font-size:40px;font-family:var(--serif);margin:10px 0}
.best{font-size:13px;color:var(--ink-3)}

/* ---------- prefix card ---------- */
.prefix{margin-top:18px;border-top:1px dashed var(--line);padding-top:10px}
.prefix summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500}
.prefix table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.prefix td{padding:3px 4px;border-bottom:1px solid var(--grid)}
.prefix td.u{font-size:15px}
.prefix td.p{color:var(--ink-3)}

@media (max-width:860px){
  header{padding:8px 12px;gap:8px}
  header h1 small{display:none}
  main{padding:12px 12px 60px}
  .index,.builder{grid-template-columns:1fr}
  .detail{position:fixed;inset:auto 0 0 0;top:auto;max-height:86vh;overflow:auto;border-radius:14px 14px 0 0;z-index:30;transform:translateY(105%);transition:transform .25s ease;padding:18px 18px 28px}
  .detail.open{transform:translateY(0)}
  .detail .close{display:block;position:absolute;top:10px;right:12px;border:0;background:var(--paper);border-radius:999px;width:32px;height:32px;color:var(--ink-2)}
  .backdrop.on{display:block}
  .center .big{font-size:48px}
  .flow{grid-template-columns:1fr;gap:10px}
  .flow .side.left{align-items:flex-start;text-align:left}
  .flow .side.left h4{text-align:left}
  .board{position:static}
}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
.site-footer{text-align:center;font-size:12px;color:var(--ink-3);padding:24px 16px 32px;border-top:1px solid var(--line);margin-top:32px}
.site-footer a{color:inherit}
</style>
</head>
<body>
<header>
  <h1>単位のつながり帳<small>高校 理科（物理・化学・生物・地学）</small></h1>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="index">単位表</button>
    <button role="tab" aria-selected="false" data-view="builder">くみたてる</button>
    <button role="tab" aria-selected="false" data-view="quiz">クイズ</button>
  </nav>
  <span class="spacer"></span>
  <button class="theme" id="themeBtn" title="表示を切り替える" aria-label="ライト／ダーク切り替え">◐</button>
</header>

<main>
<!-- ===== 単位表 ===== -->
<section class="view on" id="view-index">
  <div class="index">
    <div>
      <div class="toolbar">
        <div class="search"><span style="color:var(--ink-3)">⌕</span><input id="q" type="search" placeholder="記号・名前・量でさがす（例：N, ジュール, 圧力）" autocomplete="off"></div>
        <div class="chips" id="subjChips">
          <button class="chip subj" data-s="物理" aria-pressed="false">物理</button>
          <button class="chip subj" data-s="化学" aria-pressed="false">化学</button>
          <button class="chip subj" data-s="生物" aria-pressed="false">生物</button>
          <button class="chip subj" data-s="地学" aria-pressed="false">地学</button>
          <span class="count" id="count"></span>
        </div>
      </div>
      <div id="groups"></div>
      <details class="prefix">
        <summary>接頭語（k, m, μ など）の早見表</summary>
        <table id="prefixTable"></table>
      </details>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <aside class="detail" id="detail" aria-live="polite">
      <div class="hint"><span class="u">N = kg·m/s<sup>2</sup></span>単位をひとつ選ぶと、その単位が<br>何からできていて、何をつくれるかが見えます。</div>
    </aside>
  </div>
</section>

<!-- ===== くみたてる ===== -->
<section class="view" id="view-builder">
  <div class="builder">
    <div class="palette">
      <p class="lead" style="margin:0 0 10px;font-size:13px;color:var(--ink-2)">単位をタップして式に入れます。同じ単位を2回入れると2乗になります。</p>
      <div class="search" style="margin-bottom:10px"><span style="color:var(--ink-3)">⌕</span><input id="bq" type="search" placeholder="単位をさがす" autocomplete="off"></div>
      <div id="btiles" class="tiles"></div>
    </div>
    <div class="board">
      <h2>単位をかけ合わせる</h2>
      <p class="lead">かける（分子）か、わる（分母）かを選んでから単位を入れます。</p>
      <div class="mode">入れる先：
        <button id="modeNum" aria-pressed="true">× かける</button>
        <button id="modeDen" aria-pressed="false">÷ わる</button>
        <span class="spacer"></span>
        <button id="clearBtn" style="border-color:transparent;color:var(--ink-3)">クリア</button>
      </div>
      <div class="frac">
        <label>分子</label><div class="slot" id="numSlot"><span class="ph">まだ何も入っていません</span></div>
        <span></span><div class="bar"></div>
        <label>分母</label><div class="slot" id="denSlot"><span class="ph">わる単位があればここに</span></div>
      </div>
      <div class="result">
        <div class="rq">SI基本単位で書くと</div>
        <div class="rexp" id="rexp">—</div>
        <div class="rq" id="rdim"></div>
        <div class="matches" id="matches"></div>
      </div>
      <div class="goal">
        <h4>お題：この単位をつくってみよう</h4>
        <div class="goals" id="goals"></div>
        <div class="verdict" id="verdict" hidden></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== クイズ ===== -->
<section class="view" id="view-quiz">
  <div class="quiz" id="quizBox"></div>
</section>
</main>

<footer class="site-footer">制作：のざたん ／ <a href="https://meetupsensei.com">meetupsensei.com</a></footer>

<script>
/* =========================================================

const PREFIXES = [['T','テラ','10<sup>12</sup>'],['G','ギガ','10<sup>9</sup>'],['M','メガ','10<sup>6</sup>'],['k','キロ','10<sup>3</sup>'],['h','ヘクト','10<sup>2</sup>'],['d','デシ','10<sup>−1</sup>'],['c','センチ','10<sup>−2</sup>'],['m','ミリ','10<sup>−3</sup>'],['μ','マイクロ','10<sup>−6</sup>'],['n','ナノ','10<sup>−9</sup>'],['p','ピコ','10<sup>−12</sup>']];
const FIELD_ORDER = ['基本単位','力学','熱','波・光','電磁気','原子','化学','生物','地学','天文'];

/* ===== 次元計算 ===== */
const byId = Object.fromEntries(UNITS.map(u=>[u.id,u]));
function dimOf(u){
  if(u._dim) return u._dim;
  if(u.dim) return (u._dim = {...u.dim});
  const d={};
  for(const [id,e] of u.forms[0]){ const dd=dimOf(byId[id]); for(const k in dd){ d[k]=(d[k]||0)+dd[k]*e; if(d[k]===0) delete d[k]; } }
  return (u._dim=d);
}
UNITS.forEach(dimOf);
const dimKey = d => BASE_ORDER.map(k=>d[k]||0).join(',');
const sup = n => n===1?'':`<sup>${n<0?'−':''}${Math.abs(n)}</sup>`;
function fmtDim(d){
  const num=[],den=[];
  for(const k of BASE_ORDER){ const e=d[k]||0; if(e>0) num.push(k+sup(e)); else if(e<0) den.push(k+sup(-e)); }
  if(!num.length && !den.length) return '<span class="u">1</span>（無次元）';
  let s = num.length? num.join('·') : '1';
  if(den.length) s += '/' + (den.length>1?'('+den.join('·')+')':den[0]);
  return `<span class="u">${s}</span>`;
}
function fmtBracket(d){
  const parts=[]; for(const k of BASE_ORDER){ const e=d[k]||0; if(e) parts.push(BASE_LETTER[k]+sup(e)); }
  return parts.length? `<span class="u br">[${parts.join(' ')}]</span>` : '';
}
function fmtForm(form, clickable){
  const num=[],den=[];
  for(const [id,e] of form){
    const u=byId[id]; const compound=/[\/·]/.test(u.sym);
    let s = (compound && Math.abs(e)!==1) ? '('+u.sym+')' : u.sym;
    s += sup(Math.abs(e));
    s = clickable ? `<button class="tok" data-go="${id}">${s}</button>` : s;
    (e>0?num:den).push(s);
  }
  let s = num.length? num.join('·') : '1';
  if(den.length) s += '/' + (den.length>1?'('+den.join('·')+')':den[0]);
  return s;
}
const sameDim = u => UNITS.filter(v=>v!==u && v.kind!=='scale' && dimKey(dimOf(v))===dimKey(dimOf(u)));
const usedIn = u => UNITS.filter(v=>v!==u && v.forms && v.forms.some(f=>f.some(([id])=>id===u.id)));
const mainSubj = u => u.subj[0];
const searchText = u => (u.plain||u.sym).replace(/<[^>]+>/g,'')+' '+u.name+' '+u.qty+' '+u.subj.join(' ')+' '+u.field;

const qInput=document.getElementById('q'); const groupsEl=document.getElementById('groups'); const countEl=document.getElementById('count');
const activeSubj=new Set(); let selectedId=null;
document.querySelectorAll('#subjChips .chip').forEach(c=>c.addEventListener('click',()=>{
  const s=c.dataset.s; activeSubj.has(s)?activeSubj.delete(s):activeSubj.add(s);
  c.setAttribute('aria-pressed',activeSubj.has(s)); renderIndex();
}));
qInput.addEventListener('input',renderIndex);
function tileHTML(u, extra=''){
  return `<button class="tile ${u.kind==='base'?'base':''} ${u.id===selectedId?'sel':''}" data-s="${mainSubj(u)}" data-id="${u.id}" ${extra}>
    <span class="sym u">${u.sym}</span><span class="qty">${u.qty}</span>${u.kind==='scale'?'<span class="scale">目盛り</span>':''}</button>`;
}
function filtered(q){
  q=(q||'').trim().toLowerCase();
  return UNITS.filter(u=>{
    if(activeSubj.size && !u.subj.some(s=>activeSubj.has(s))) return false;
    if(q && !searchText(u).toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderIndex(){
  const list=filtered(qInput.value);
  countEl.textContent=`${list.length} / ${UNITS.length}`;
  if(!list.length){ groupsEl.innerHTML='<p class="empty">見つかりませんでした。記号（N）や量の名前（圧力）で試してみてください。</p>'; return; }
  const groups={}; list.forEach(u=>(groups[u.field]=groups[u.field]||[]).push(u));
  groupsEl.innerHTML = FIELD_ORDER.filter(f=>groups[f]).map(f=>`<div class="group"><h3>${f}</h3><div class="tiles">${groups[f].map(u=>tileHTML(u)).join('')}</div></div>`).join('');
}
groupsEl.addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(t) selectUnit(t.dataset.id); });

const detail=document.getElementById('detail'); const backdrop=document.getElementById('backdrop');
function selectUnit(id, fromTok){
  selectedId=id; const u=byId[id]; const d=dimOf(u);
  document.querySelectorAll('#groups .tile').forEach(t=>t.classList.toggle('sel',t.dataset.id===id));
  const makers = u.forms ? u.forms[0] : null;
  const users = usedIn(u); const same = sameDim(u);
  const leftHTML = u.kind==='base'
    ? `<p class="none">これ以上分けられない<b>基本単位</b>。7 つの基本単位のひとつ。</p>`
    : u.kind==='scale'
    ? `<p class="none">単位ではなく目盛り（スケール）。次元はない。</p>`
    : makers
    ? makers.map(([mid,e])=>`<button class="link" data-go="${mid}"><span class="u">${byId[mid].sym}${sup(Math.abs(e))}</span><small>${byId[mid].qty}${e<0?'（÷）':''}</small></button>`).join('')
    : `<p class="none">SI基本単位で書くと ${fmtDim(d)}。<br>換算：${u.conv||''}</p>`;
  const rightHTML = users.length
    ? users.slice(0,8).map(v=>{ const f=v.forms.find(f=>f.some(([id])=>id===u.id)); const ff=fmtForm(f,false); const eq = ff===v.sym ? '' : ` = <span class="u">${ff}</span>`; return `<button class="link" data-go="${v.id}"><span class="u">${v.sym}</span>${eq}<small>${v.qty}</small></button>`; }).join('')
    : `<p class="none">この帳の中では、この単位を材料にする単位はありません。</p>`;
  detail.innerHTML = `
    <button class="close" aria-label="閉じる">✕</button>
    <div class="subjline">${u.subj.filter(s=>s!=='基本').map(s=>`<span class="tag" data-s="${s}">${s}</span>`).join('')}<span class="tag">${u.field}</span>${u.kind==='base'?'<span class="tag">SI基本単位</span>':u.kind==='derived'?'<span class="tag">SI組立単位</span>':u.kind==='scale'?'<span class="tag">単位ではない</span>':'<span class="tag">SI以外</span>'}</div>
    <div class="flow">
      <div class="side left"><h4>何からできているか</h4>${leftHTML}</div>
      <div class="center"><span class="big u">${u.sym}</span><div class="name">${u.name}</div><div class="qty">${u.qty}</div></div>
      <div class="side right"><h4>何をつくれるか</h4>${rightHTML}</div>
    </div>
    ${u.forms && u.forms.length ? `<div class="sec"><h4>組み立て方${u.forms.length>1?'（'+u.forms.length+' 通り）':''}</h4>${u.forms.map(f=>`<div class="eq"><span class="u">${u.sym}</span> = ${fmtForm(f,true)}</div>`).join('')}</div>`:''}
    ${u.kind!=='scale' ? `<div class="sec"><h4>SI基本単位で書くと</h4><div class="dimrow">${fmtDim(d)} ${fmtBracket(d)}</div></div>`:''}
    ${u.conv ? `<div class="sec"><h4>換算</h4><p class="conv u">${u.conv}</p></div>`:''}
    ${same.length ? `<div class="sec"><h4>同じ次元をもつ単位</h4><div class="chips">${same.map(v=>`<button class="chip" data-go="${v.id}"><span class="u">${v.sym}</span>　${v.qty}</button>`).join('')}</div></div>`:''}
    ${u.formulas ? `<div class="sec"><h4>この単位が出てくる式</h4><div class="formulas">${u.formulas.map(f=>`<span class="formula">${f}</span>`).join('')}</div></div>`:''}
    <div class="sec"><h4>メモ</h4><p class="note">${u.note}</p></div>
  `;
  detail.classList.add('open'); backdrop.classList.add('on');
  if(!fromTok) detail.scrollTop=0;
}
detail.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){ selectUnit(go.dataset.go,true); return; }

});

const bq=document.getElementById('bq'); const btiles=document.getElementById('btiles');
const numSlot=document.getElementById('numSlot'), denSlot=document.getElementById('denSlot');
let mode='num'; const expr={}; // id -> exponent
let goalId=null; const goalsDone=new Set();
const BUILDABLE = UNITS.filter(u=>u.kind!=='scale');
function renderPalette(){
  const q=bq.value.trim().toLowerCase();
  const list=BUILDABLE.filter(u=>!q||searchText(u).toLowerCase().includes(q));
  btiles.innerHTML=list.map(u=>tileHTML(u)).join('');
}
bq.addEventListener('input',renderPalette);
btiles.addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(!t) return; addPiece(t.dataset.id, mode==='num'?1:-1); });
document.getElementById('modeNum').addEventListener('click',()=>setMode('num'));
document.getElementById('modeDen').addEventListener('click',()=>setMode('den'));
function setMode(m){ mode=m; document.getElementById('modeNum').setAttribute('aria-pressed',m==='num'); document.getElementById('modeDen').setAttribute('aria-pressed',m==='den'); numSlot.classList.toggle('hot',m==='num'); denSlot.classList.toggle('hot',m==='den'); }
document.getElementById('clearBtn').addEventListener('click',()=>{ for(const k in expr) delete expr[k]; renderBuilder(); });
function addPiece(id,sign){ expr[id]=(expr[id]||0)+sign; if(expr[id]===0) delete expr[id]; renderBuilder(); }
function renderBuilder(){
  const num=Object.entries(expr).filter(([,e])=>e>0), den=Object.entries(expr).filter(([,e])=>e<0);
  const piece=([id,e])=>`<span class="piece"><span class="u">${byId[id].sym}${sup(Math.abs(e))}</span><button data-flip="${id}" title="分子↔分母">⇅</button><button data-rm="${id}" title="外す">✕</button></span>`;
  numSlot.innerHTML = num.length? num.map(piece).join('') : '<span class="ph">まだ何も入っていません</span>';
  denSlot.innerHTML = den.length? den.map(piece).join('') : '<span class="ph">わる単位があればここに</span>';
  const d={}; for(const id in expr){ const dd=dimOf(byId[id]); for(const k in dd){ d[k]=(d[k]||0)+dd[k]*expr[id]; if(d[k]===0) delete d[k]; } }
  const has=Object.keys(expr).length;
  document.getElementById('rexp').innerHTML = has? fmtDim(d) : '—';
  document.getElementById('rdim').innerHTML = has? fmtBracket(d) : '';
  const key=dimKey(d);
  const rank={derived:0,base:1,nonsi:2};
  const matches = has? UNITS.filter(u=>u.kind!=='scale' && dimKey(dimOf(u))===key && !(Object.keys(expr).length===1 && expr[u.id]===1)).sort((a,b)=>rank[a.kind]-rank[b.kind]) : [];
  const ml=document.getElementById('matches');
  if(!has) ml.innerHTML='';
  else if(!matches.length) ml.innerHTML='<p class="rq">この次元に名前のついた単位は、この帳にはありません。別の組み合わせを試してみましょう。</p>';
  else ml.innerHTML = `<p class="rq">この次元をもつ単位</p>` + matches.map(u=>`<button class="match" data-open="${u.id}"><span class="u">${u.sym}</span><span><span class="n">${u.name}</span><br><span class="q">${u.qty}${u.kind==='nonsi'?'（係数は別）':''}</span></span></button>`).join('');
  // お題
  const v=document.getElementById('verdict');
  if(goalId && has){
    const g=byId[goalId];
    if(dimKey(dimOf(g))===key){
      v.hidden=false; v.className='verdict ok'; v.innerHTML=`できた！ <span class="u">${g.sym}</span> = ${fmtDim(d)}`;
      goalsDone.add(goalId); renderGoals();
    } else { v.hidden=false; v.className='verdict ng'; v.innerHTML=`まだ <span class="u">${g.sym}</span> ではありません。目標は ${fmtDim(dimOf(g))}`; }
  } else v.hidden=true;
}
numSlot.addEventListener('click',onPiece); denSlot.addEventListener('click',onPiece);
function onPiece(e){
  const rm=e.target.closest('[data-rm]'); if(rm){ delete expr[rm.dataset.rm]; renderBuilder(); return; }
  const fl=e.target.closest('[data-flip]'); if(fl){ expr[fl.dataset.flip]*=-1; renderBuilder(); }
}
document.getElementById('matches').addEventListener('click',e=>{ const m=e.target.closest('[data-open]'); if(m){ showView('index'); selectUnit(m.dataset.open); } });
const GOALS=['N','J','W','Pa','C','V','ohm','F','T','Wb','H','Hz','Gy','kg_m3'];
function renderGoals(){
  document.getElementById('goals').innerHTML = GOALS.map(id=>`<button data-goal="${id}" aria-pressed="${goalId===id}" class="${goalsDone.has(id)?'done':''}"><span class="u">${byId[id].sym}</span>${goalsDone.has(id)?' ✓':''}</button>`).join('');
}
document.getElementById('goals').addEventListener('click',e=>{ const b=e.target.closest('[data-goal]'); if(!b) return; goalId = goalId===b.dataset.goal? null : b.dataset.goal; renderGoals(); renderBuilder(); });
setMode('num'); renderPalette(); renderGoals(); renderBuilder();

/* ===== クイズ ===== */
const quizBox=document.getElementById('quizBox');
let quizStarted=false, quizSubj=new Set(), qs=[], qi=0, score=0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
function quizPool(){ return UNITS.filter(u=>u.kind!=='scale' && (!quizSubj.size || u.subj.some(s=>quizSubj.has(s)))); }
function makeQuestions(n){
  const pool=quizPool(); const named=pool.filter(u=>u.kind!=='base');
  const out=[]; let guard=0;
  while(out.length<n && guard++<200){
    const type=['sym','build','combine','sym'][Math.random()*4|0];
    if(type==='sym'){
      const u=pick(pool,1)[0];
      const okv=v=>v!==u && v.kind!=='scale' && (v.plain||v.sym)!==(u.plain||u.sym) && v.qty!==u.qty;
      let others=pick(UNITS.filter(v=>okv(v) && v.field===u.field),3);
      if(others.length<3) others=others.concat(pick(UNITS.filter(v=>okv(v) && !others.includes(v) && v.subj[0]===u.subj[0]),3-others.length));
      if(others.length<3) others=others.concat(pick(UNITS.filter(v=>okv(v) && !others.includes(v)),3-others.length));
      out.push({type:'記号を選ぶ',text:`「${u.name}」（${u.qty}）の記号は？`,opts:shuffle([u,...others]).map(v=>({html:`<span class="u">${v.sym}</span>`,ok:v===u})),
        expl:`<b><span class="u">${u.sym}</span> ${u.name}</b>：${u.note}`});
    } else if(type==='build'){
      const cands=named.filter(u=>u.forms && Object.keys(dimOf(u)).length); if(!cands.length) continue;
      const u=pick(cands,1)[0]; const key=dimKey(dimOf(u));
      const wrong=[]; const seen=new Set([key]);
      for(const v of shuffle(UNITS.filter(v=>v.forms))){ const k=dimKey(dimOf(v)); if(seen.has(k)) continue; seen.add(k); wrong.push(v); if(wrong.length===3) break; }
      if(wrong.length<3) continue;
      out.push({type:'組み立て方を選ぶ',text:`<span class="u">${u.sym}</span>（${u.qty}）を基本単位で表すと？`,
        opts:shuffle([u,...wrong]).map(v=>({html:fmtDim(dimOf(v)),ok:v===u})),
        expl:`<b><span class="u">${u.sym}</span> = ${fmtForm(u.forms[0],false)}</b>　${u.note}`});
    } else {
      const cands=named.filter(u=>u.forms && u.forms.some(f=>f.length===2 && f.every(([,e])=>Math.abs(e)===1)));
      if(!cands.length) continue;
      const u=pick(cands,1)[0]; const f=u.forms.find(f=>f.length===2 && f.every(([,e])=>Math.abs(e)===1));
      const [[a,ea],[b,eb]]=f; let text;
      if(ea>0&&eb>0) text=`<span class="u">${byId[a].sym}</span> × <span class="u">${byId[b].sym}</span> はどの単位？`;
      else if(ea>0) text=`<span class="u">${byId[a].sym}</span> ÷ <span class="u">${byId[b].sym}</span> はどの単位？`;
      else text=`<span class="u">${byId[b].sym}</span> ÷ <span class="u">${byId[a].sym}</span> はどの単位？`;
      const key=dimKey(dimOf(u)); const others=pick(named.filter(v=>dimKey(dimOf(v))!==key && v.id!==a && v.id!==b),3);
      if(others.length<3) continue;
      out.push({type:'かけ算・わり算',text,opts:shuffle([u,...others]).map(v=>({html:`<span class="u">${v.sym}</span>　<small style="color:var(--ink-3)">${v.qty}</small>`,ok:v===u})),
        expl:`<b><span class="u">${u.sym}</span> = ${fmtForm(f,false)}</b>　${u.note}`});
    }
  }
  return out;
}
function renderQuizSetup(){
  let best=null; try{ best=localStorage.getItem('unitmap-best'); }catch(e){}
  quizBox.innerHTML=`<div class="qsetup"><h2 style="margin:0;font-size:18px">単位クイズ</h2><p>10 問。記号・組み立て方・かけ算わり算の 3 種類が混ざって出ます。</p>
    <div class="chips" id="qsubj">${SUBJ.map(s=>`<button class="chip subj" data-s="${s}" aria-pressed="${quizSubj.has(s)}">${s}</button>`).join('')}</div>
    <p style="font-size:12px;color:var(--ink-3)">教科を選ばなければ全範囲から出題します。</p>
    <button class="btn" id="startQuiz">はじめる</button>
    ${best?`<p class="best">これまでの最高：${best} / 10</p>`:''}</div>`;
  quizBox.querySelectorAll('#qsubj .chip').forEach(c=>c.addEventListener('click',()=>{ const s=c.dataset.s; quizSubj.has(s)?quizSubj.delete(s):quizSubj.add(s); c.setAttribute('aria-pressed',quizSubj.has(s)); }));
  document.getElementById('startQuiz').addEventListener('click',()=>{ qs=makeQuestions(10); qi=0; score=0; quizStarted=true; renderQuestion(); });
}
function renderQuestion(){
  if(qi>=qs.length){ return renderResult(); }
  const q=qs[qi];
  quizBox.innerHTML=`<div class="qhead"><span>第 ${qi+1} 問 / ${qs.length}</span><span>正解 ${score}</span></div>
    <div class="qtype">${q.type}</div><div class="qtext">${q.text}</div>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o.html}</span></button>`).join('')}</div>
    <div class="expl" id="expl"></div>
    <div class="qfoot"><button class="btn ghost" id="quitQuiz">やめる</button><button class="btn" id="nextQ" disabled>${qi+1===qs.length?'結果を見る':'次へ'}</button></div>`;
  quizBox.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i; const ok=q.opts[i].ok; if(ok) score++;
    quizBox.querySelectorAll('.opt').forEach((x,j)=>{ x.disabled=true; if(q.opts[j].ok) x.classList.add('right'); else if(j===i) x.classList.add('wrong'); });
    const ex=document.getElementById('expl'); ex.innerHTML=(ok?'正解。':'惜しい。')+' '+q.expl; ex.classList.add('on');
    document.querySelector('.qhead span:last-child').textContent=`正解 ${score}`;
    document.getElementById('nextQ').disabled=false;
  }));
  document.getElementById('nextQ').addEventListener('click',()=>{ qi++; renderQuestion(); });
  document.getElementById('quitQuiz').addEventListener('click',()=>{ quizStarted=false; renderQuizSetup(); });
}
function renderResult(){
  let best=0; try{ best=+localStorage.getItem('unitmap-best')||0; if(score>best){ best=score; localStorage.setItem('unitmap-best',score); } }catch(e){}
  const msg = score===10?'全問正解。単位のつながりが見えています。':score>=7?'いい調子。間違えた単位を「単位表」でもう一度たどってみよう。':'まず「くみたてる」で N・J・W・V をつくってみると、つながりが見えてきます。';
  quizBox.innerHTML=`<div class="qsetup"><p style="margin:0">結果</p><div class="score">${score} <span style="font-size:20px;color:var(--ink-3)">/ 10</span></div><p>${msg}</p><p class="best">最高：${best} / 10</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn" id="again">もう一度</button><button class="btn ghost" id="toIndex">単位表へ</button></div></div>`;
  document.getElementById('again').addEventListener('click',()=>{ qs=makeQuestions(10); qi=0; score=0; renderQuestion(); });
  document.getElementById('toIndex').addEventListener('click',()=>{ quizStarted=false; showView('index'); });
}
</script>
